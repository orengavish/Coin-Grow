<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Grow — Prof Penny Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Georgia, serif;
    gap: 24px;
  }

  /* ── Phone frame ─────────────────────────────── */
  .phone {
    width: 390px;
    height: 844px;
    background: #0A1628;
    border-radius: 54px;
    border: 8px solid #1E3A5F;
    box-shadow:
      0 0 0 2px #0D2137,
      0 40px 80px rgba(0,0,0,0.7),
      inset 0 0 20px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* notch */
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #1E3A5F;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  /* ── Screen ──────────────────────────────────── */
  .screen {
    flex: 1;
    background: linear-gradient(160deg, #0D2137 0%, #0A1F3D 40%, #071020 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 24px 40px;
    position: relative;
    overflow: hidden;
  }

  /* stars */
  .stars {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 0.9; transform: scale(1.2); }
  }

  /* ground */
  .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(180deg, #1B3A6B 0%, #0D2137 100%);
    border-radius: 60% 60% 0 0 / 30px 30px 0 0;
  }

  /* tree branch */
  .branch {
    position: absolute;
    bottom: 195px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 18px;
    background: linear-gradient(180deg, #2A5A9B, #1E3A6B);
    border-radius: 9px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .branch::before {
    content: '';
    position: absolute;
    bottom: 0; left: 22px;
    width: 14px; height: 90px;
    background: linear-gradient(180deg, #2A5A9B, #1A3060);
    border-radius: 7px;
    transform-origin: bottom center;
    transform: rotate(-10deg);
  }
  .branch::after {
    content: '';
    position: absolute;
    bottom: 0; right: 22px;
    width: 14px; height: 70px;
    background: linear-gradient(180deg, #2A5A9B, #1A3060);
    border-radius: 7px;
    transform-origin: bottom center;
    transform: rotate(10deg);
  }

  /* ── Penny owl ───────────────────────────────── */
  .owl-wrap {
    position: absolute;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: float 3.5s ease-in-out infinite;
    cursor: pointer;
    z-index: 4;
  }
  @keyframes float {
    0%, 100% { transform: translateX(-50%) translateY(0px); }
    50%       { transform: translateX(-50%) translateY(-12px); }
  }

  .owl-img {
    width: 150px;
    height: auto;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,0.6));
    transition: transform 0.2s ease;
  }
  .owl-wrap:hover .owl-img {
    transform: scale(1.06);
  }
  .owl-wrap:active .owl-img {
    transform: scale(0.97);
  }

  .owl-name {
    font-size: 13px;
    font-weight: bold;
    color: #D4A017;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 6px rgba(212,160,23,0.5);
    font-style: italic;
  }

  /* sparkle coins */
  .sparkle {
    position: absolute;
    font-size: 16px;
    animation: sparkle-float var(--sd) ease-in-out infinite;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes sparkle-float {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    30%  { opacity: 1; transform: translateY(-18px) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.5); }
  }

  /* ── Speech bubble ───────────────────────────── */
  .speech-bubble {
    position: absolute;
    bottom: 370px;
    left: 50%;
    transform: translateX(-58%);
    background: #E8F4FF;
    border: 2px solid #D4A017;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 13px;
    color: #0A1628;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    z-index: 5;
    transition: opacity 0.3s, transform 0.3s;
  }
  .speech-bubble.hidden {
    opacity: 0;
    transform: translateX(-58%) scale(0.9);
    pointer-events: none;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -12px; right: 28px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #D4A017;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -10px; right: 28px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #E8F4FF;
    z-index: 1;
  }

  /* ── Owl bubble menu ─────────────────────────── */
  .bubble-menu {
    position: absolute;
    bottom: 215px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .bubble-menu.visible {
    opacity: 1;
    pointer-events: all;
  }
  .bubble-btn {
    background: rgba(14, 42, 84, 0.97);
    border: 1.5px solid #D4A017;
    border-radius: 22px;
    padding: 9px 18px;
    color: #CCE4FF;
    font-size: 13px;
    font-family: Georgia, serif;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    transition: background 0.15s, transform 0.1s;
    animation: bubble-in 0.3s ease both;
  }
  .bubble-btn:nth-child(2) { animation-delay: 0.05s; }
  .bubble-btn:nth-child(3) { animation-delay: 0.10s; }
  .bubble-btn:nth-child(4) { animation-delay: 0.15s; }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateX(-10px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  .bubble-btn:hover {
    background: rgba(212,160,23,0.15);
    transform: translateX(3px);
  }
  .bubble-btn .b-icon { margin-right: 8px; }

  /* ── UI ──────────────────────────────────────── */
  .header {
    text-align: center;
    z-index: 2;
  }
  .logo {
    font-size: 28px;
    color: #D4A017;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 2px 10px rgba(212,160,23,0.6);
  }
  .tagline {
    font-size: 13px;
    color: rgba(204,228,255,0.5);
    margin-top: 4px;
    font-style: italic;
  }

  .bottom-ui {
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .play-btn {
    background: linear-gradient(135deg, #D4A017, #B8860B);
    color: #1a0e00;
    border: none;
    border-radius: 30px;
    padding: 16px 52px;
    font-size: 18px;
    font-weight: bold;
    font-family: Georgia, serif;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(212,160,23,0.5);
    letter-spacing: 1px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .play-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(212,160,23,0.6);
  }
  .play-btn:active { transform: translateY(0); }

  .lesson-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(30,90,180,0.2);
    border: 1px solid rgba(212,160,23,0.3);
    border-radius: 20px;
    padding: 8px 16px;
    color: rgba(204,228,255,0.7);
    font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #D4A017; }

  /* ── Floating HUD owl (corner) ───────────────── */
  .hud-owl {
    position: absolute;
    bottom: 90px;
    right: 20px;
    width: 60px;
    cursor: pointer;
    animation: float-hud 4s ease-in-out infinite;
    z-index: 20;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  @keyframes float-hud {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  .hud-owl img {
    width: 100%;
    height: auto;
    transition: transform 0.2s;
  }
  .hud-owl:hover img { transform: scale(1.1); }

  /* ── Labels ──────────────────────────────────── */
  .label {
    color: rgba(204,228,255,0.4);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Header -->
    <div class="header">
      <div class="logo">🪙 COIN GROW</div>
      <div class="tagline">Learn money by living it.</div>
    </div>

    <!-- Speech bubble -->
    <div class="speech-bubble" id="bubble">Hoo! Ready for an adventure? 🪙</div>

    <!-- Branch -->
    <div class="branch"></div>

    <!-- Bubble menu (shown on owl click) -->
    <div class="bubble-menu" id="bubbleMenu">
      <button class="bubble-btn" onclick="handleBubble('ask')"><span class="b-icon">💬</span>Ask me anything</button>
      <button class="bubble-btn" onclick="handleBubble('journey')"><span class="b-icon">📖</span>Your Journey</button>
      <button class="bubble-btn" onclick="handleBubble('trophy')"><span class="b-icon">🏆</span>Your Trophy</button>
      <button class="bubble-btn" onclick="handleBubble('hint')"><span class="b-icon">✨</span>Give me a hint</button>
    </div>

    <!-- Penny on branch -->
    <div class="owl-wrap" id="owlWrap" onclick="toggleMenu()">
      <span class="sparkle" style="top:-28px;left:18px;--sd:2.2s;">✨</span>
      <span class="sparkle" style="top:-16px;right:8px;--sd:1.8s;animation-delay:0.7s;">🪙</span>
      <span class="sparkle" style="top:4px;left:-10px;--sd:2.5s;animation-delay:1.3s;">⭐</span>
      <img class="owl-img" id="pennyImg" src="../Images/penny-wave.png" alt="Prof Penny">
      <div class="owl-name">Prof Penny</div>
    </div>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Floating HUD owl (bottom-right corner) -->
    <div class="hud-owl" onclick="toggleMenu()" title="Ask Prof Penny">
      <img src="../Images/penny-wave.png" alt="Prof Penny">
    </div>

    <!-- Bottom UI -->
    <div class="bottom-ui">
      <div class="lesson-pill">
        <div class="dot"></div>
        Lesson 1 · The Orange Quest
      </div>
      <button class="play-btn" onclick="celebrate()">▶  Start Adventure</button>
    </div>

  </div>
</div>

<div class="label">click Penny or the corner owl · tap any bubble</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 45; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*75}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*2+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  let menuOpen = false;

  function toggleMenu() {
    menuOpen = !menuOpen;
    document.getElementById('bubbleMenu').classList.toggle('visible', menuOpen);
    const img = document.getElementById('pennyImg');
    img.src = menuOpen ? '../Images/penny-thoughtful.png' : '../Images/penny-wave.png';
    if (menuOpen) {
      setBubble('Hoo... what do you want to know? 🦉', false);
    }
  }

  function handleBubble(type) {
    menuOpen = false;
    document.getElementById('bubbleMenu').classList.remove('visible');

    const responses = {
      ask: ['What can a basket of apples get you?', 'What does Fatima need most?', 'Ask me about any trader…'],
      journey: ['You have spoken to two people today.', 'The market holds three paths to the orange…', 'What you carry matters.'],
      trophy: ['No trophy yet — but you are close.', 'The Trader trophy awaits. Keep going.', 'Earn it by finding the orange for Beni.'],
      hint: ['You already know what Marco needs.', 'Fatima mentioned something this morning…', 'The fastest path is not always the best.'],
    };

    const list = responses[type];
    const text = list[Math.floor(Math.random() * list.length)];
    setBubble(text, true);

    const img = document.getElementById('pennyImg');
    img.src = '../Images/penny-thoughtful.png';
    setTimeout(() => { img.src = '../Images/penny-wave.png'; }, 2200);
  }

  function celebrate() {
    const img = document.getElementById('pennyImg');
    img.src = '../Images/penny-celebrate.png';
    setBubble('The adventure begins! 🌟', false);
    setTimeout(() => { img.src = '../Images/penny-wave.png'; }, 2500);
  }

  function setBubble(text, autoHide) {
    const b = document.getElementById('bubble');
    b.classList.remove('hidden');
    b.textContent = text;
    if (autoHide) {
      clearTimeout(window._bubbleTimer);
      window._bubbleTimer = setTimeout(() => b.classList.add('hidden'), 4000);
    }
  }
</script>
</body>
</html>
